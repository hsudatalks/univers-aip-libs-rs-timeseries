[package]
name="univers-aip-lib-timeseries"
version="0.1.1"
edition="2021"
rust-version="1.89"
license="MIT"
description="Time-series aggregation, pagination and in-memory reference storage"
repository="https://github.com/hsudatalks/univers-aip-libs-rs-timeseries"
publish=["univers"]
readme="README.md"
include=["Cargo.toml","Cargo.lock","README.md","src/**","tests/**","scripts/**",".cargo/config.toml"]
[workspace]
members=["."]
resolver="2"
[features]
default=[]
state-history-adapter=["dep:univers-aip-contracts-world"]
[dependencies]
univers-aip-contracts-world={version=">=1.0.0-rc.1, <1.0.0",registry="univers",default-features=false,features=["state-history"],optional=true}
async-trait="0.1"
chrono={version="0.4",features=["serde","clock"]}
serde={version="1",features=["derive"]}
serde_json="1"
univers-aip-contracts-data={version=">=1.0.0-rc.1, <1.0.0",registry="univers",default-features=false,features=["core","series-types","timeseries"]}
[dev-dependencies]
tokio={version="1",features=["macros","rt"]}
